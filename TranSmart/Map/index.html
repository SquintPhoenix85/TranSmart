<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Transit coverage map</title>
    <link rel="stylesheet" href="leaflet/leaflet.css">
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #202020;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .legend, .tile-status {
            position: absolute;
            z-index: 1000;
            padding: 10px 12px;
            border: 1px solid #454545;
            border-radius: 8px;
            background: rgba(36, 36, 36, 0.96);
            color: #f5f5f5;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.28);
            font-size: 12px;
        }

        .legend {
            top: 12px;
            right: 12px;
            line-height: 1.8;
        }

        .tile-status {
            bottom: 24px;
            left: 12px;
            max-width: min(440px, calc(100vw - 48px));
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border: 1px solid white;
            border-radius: 50%;
            box-shadow: 0 0 0 1px #6b7280;
        }

        .selected-dot { background: #0078d4; }
        .newly-covered-dot { background: #ff8c00; }
        .covered-dot { background: #13a10e; }
        .uncovered-dot { background: #8a8a8a; }
        .candidate-dot { background: #8a8a8a; border: 2px solid #e6c84a; }
        .atm-dot { background: #7c3aed; }
        .nearest-atm-dot { background: #ff6048; }
        .nearby-atm-dot { background: #ffb547; }
        .selected-atm-dot { background: #00c2ff; }
        .origin-dot { background: #facc15; }

        .leaflet-interactive {
            transition: fill 320ms ease, fill-opacity 320ms ease, stroke 320ms ease, stroke-width 320ms ease;
        }

        .current-site {
            animation: selected-pulse 900ms ease-in-out infinite alternate;
        }

        .newly-covered {
            animation: coverage-pop 520ms ease-out;
        }

        @keyframes selected-pulse {
            from { stroke-width: 2; }
            to { stroke-width: 5; }
        }

        @keyframes coverage-pop {
            0% { opacity: 0.45; }
            100% { opacity: 1; }
        }

        @media (prefers-reduced-motion: reduce) {
            .leaflet-interactive { transition: none; }
            .current-site, .newly-covered { animation: none; }
        }
    </style>
</head>
<body>
    <div id="map" aria-label="Animated replay of graph coverage decisions"></div>
    <div class="legend" aria-label="Map legend">
        <div class="legend-item coverage-legend"><span class="legend-dot selected-dot"></span>Sitio seleccionado</div>
        <div class="legend-item coverage-legend"><span class="legend-dot newly-covered-dot"></span>Cubierto en este paso</div>
        <div class="legend-item coverage-legend"><span class="legend-dot covered-dot"></span>Cubierto anteriormente</div>
        <div class="legend-item coverage-legend"><span class="legend-dot uncovered-dot"></span>Pendiente por cubrir</div>
        <div class="legend-item coverage-legend"><span class="legend-dot candidate-dot"></span>Candidato elegible</div>
        <div class="legend-item atm-legend"><span class="legend-dot atm-dot"></span>Otros cajeros</div>
        <div class="legend-item atm-legend"><span class="legend-dot nearby-atm-dot"></span>Entre los más cercanos</div>
        <div class="legend-item atm-legend"><span class="legend-dot nearest-atm-dot"></span>Más cercano</div>
        <div class="legend-item atm-legend"><span class="legend-dot selected-atm-dot"></span>Cajero seleccionado</div>
        <div class="legend-item atm-legend"><span class="legend-dot origin-dot"></span>Punto de partida</div>
    </div>
    <div id="tile-status" class="tile-status" role="status">Loading OpenStreetMap tiles...</div>

    <script src="leaflet/leaflet.js"></script>
    <script>
        (() => {
            const tileStatus = document.getElementById("tile-status");
            const markers = new Map();
            let candidateIds = new Set();
            let replaySteps = [];
            let animationsEnabled = true;
            const postStatus = message => {
                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage(message);
                }
            };

            const setTileStatus = message => {
                tileStatus.textContent = message;
            };

            try {
                const map = L.map("map").setView([11.01, -74.82], 13);
                const resultLayer = L.layerGroup().addTo(map);
                const atmLayer = L.layerGroup().addTo(map);
                const originLayer = L.layerGroup().addTo(map);
                let atmSearchMode = false;
                map.on("click", event => {
                    if (atmSearchMode) {
                        postStatus(`atm-search:${event.latlng.lat},${event.latlng.lng}`);
                    }
                });
                const tiles = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
                    maxZoom: 19,
                    attribution: "&copy; <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap contributors</a>"
                }).addTo(map);
                let tileResponseReceived = false;
                let tileErrorReceived = false;

                tiles.on("tileload", () => {
                    tileResponseReceived = true;
                    if (!tileErrorReceived) {
                        setTileStatus("OpenStreetMap basemap loaded.");
                    }
                });
                tiles.on("tileerror", () => {
                    tileResponseReceived = true;
                    tileErrorReceived = true;
                    const message = "OpenStreetMap tiles are unavailable. Check your internet connection; optimization and replay still work offline.";
                    setTileStatus(message);
                    postStatus("tile-error");
                });

                window.setTimeout(() => {
                    if (!tileResponseReceived) {
                        const message = "No OpenStreetMap tiles received. Check your internet connection; optimization and replay still work offline.";
                        setTileStatus(message);
                        postStatus("tile-error");
                    }
                }, 10000);

                const updateReplay = (position, animate) => {
                    const replayPosition = Math.max(0, Math.min(replaySteps.length, Number(position) || 0));
                    const appliedSteps = replaySteps.slice(0, replayPosition);
                    const selectedSites = new Set(appliedSteps.map(step => String(step.selectedNodeId)));
                    const coveredNodes = new Set(appliedSteps.flatMap(step =>
                        Array.isArray(step.newlyCoveredNodeIds) ? step.newlyCoveredNodeIds.map(String) : []));
                    const currentStep = replayPosition > 0 ? replaySteps[replayPosition - 1] : null;
                    const currentSiteId = currentStep ? String(currentStep.selectedNodeId) : null;
                    const newlyCoveredNodes = new Set(currentStep && Array.isArray(currentStep.newlyCoveredNodeIds)
                        ? currentStep.newlyCoveredNodeIds.map(String)
                        : []);

                    for (const [id, entry] of markers) {
                        const selected = selectedSites.has(id);
                        const currentSite = id === currentSiteId;
                        const newlyCovered = newlyCoveredNodes.has(id);
                        const covered = coveredNodes.has(id);
                        const candidate = candidateIds.has(id);
                        const color = selected ? "#0078d4" : newlyCovered ? "#ff8c00" : covered ? "#13a10e" : "#8a8a8a";
                        entry.marker.setStyle({
                            radius: currentSite ? 9 : selected ? 7 : newlyCovered ? 7 : 5,
                            color: selected ? color : candidate ? "#e6c84a" : color,
                            weight: currentSite ? 3 : selected || candidate ? 2 : 1,
                            fillColor: color,
                            fillOpacity: selected || newlyCovered ? 0.98 : covered ? 0.82 : 0.58
                        });

                        const label = currentSite ? "Selected in this step" : selected ? "Selected site" :
                            newlyCovered ? "Newly covered in this step" : covered ? "Covered vertex" : "Not covered yet";
                        entry.title.textContent = `${label} · ${candidate ? "Eligible candidate" : "Demand node only"}`;

                        const element = entry.marker.getElement();
                        if (element) {
                            element.classList.remove("current-site", "newly-covered");
                            if (animate && animationsEnabled) {
                                if (currentSite) {
                                    element.classList.add("current-site");
                                } else if (newlyCovered) {
                                    element.classList.add("newly-covered");
                                }
                            }
                        }
                    }
                };

                window.chrome.webview.addEventListener("message", event => {
                    const message = event.data;
                    if (!message || typeof message !== "object") {
                        return;
                    }

                    if (message.type === "replay") {
                        animationsEnabled = message.animationsEnabled !== false;
                        updateReplay(message.position, true);
                        return;
                    }

                    if (message.type !== "results" || !Array.isArray(message.nodes)) {
                        return;
                    }

                    resultLayer.clearLayers();
                    atmLayer.clearLayers();
                    originLayer.clearLayers();
                    markers.clear();
                    atmSearchMode = message.atmSearchMode === true;
                    replaySteps = Array.isArray(message.steps) ? message.steps : [];
                    candidateIds = new Set(Array.isArray(message.candidateNodeIds) ? message.candidateNodeIds.map(String) : []);
                    animationsEnabled = message.animationsEnabled !== false;
                    document.querySelectorAll(".coverage-legend").forEach(item => {
                        item.style.display = message.atmMode ? "none" : "flex";
                    });
                    document.querySelectorAll(".atm-legend").forEach(item => {
                        item.style.display = message.atmMode ? "flex" : "none";
                    });
                    const bounds = [];
                    for (const point of (atmSearchMode ? [] : message.nodes)) {
                        const popup = document.createElement("div");
                        const title = document.createElement("strong");
                        const nodeId = document.createElement("div");
                        title.textContent = "Not covered yet";
                        nodeId.textContent = `Node ID: ${point.id}`;
                        popup.append(title, nodeId);

                        const marker = L.circleMarker([point.lat, point.lon], {
                            radius: 5,
                            color: "#8a8a8a",
                            weight: 1,
                            fillColor: "#8a8a8a",
                            fillOpacity: 0.58
                        }).bindPopup(popup).addTo(resultLayer);
                        markers.set(String(point.id), { marker, title });
                        bounds.push([point.lat, point.lon]);
                    }

                    const nearbyAtms = Array.isArray(message.nearbyAtms) ? message.nearbyAtms : [];
                    const selectedAtmId = message.selectedAtmId == null ? null : String(message.selectedAtmId);
                    const selectedAtm = nearbyAtms.find(atm => String(atm.id) === selectedAtmId);
                    const atmPoints = nearbyAtms.length > 0
                        ? nearbyAtms
                        : message.atmMode && Array.isArray(message.atms) ? message.atms : [];
                    if (nearbyAtms.length > 0 && Array.isArray(message.atms)) {
                        for (const atm of message.atms) {
                            L.circleMarker([atm.lat, atm.lon], {
                                radius: 6,
                                color: "#5b21b6",
                                weight: 1,
                                fillColor: "#8b5cf6",
                                fillOpacity: 0.48
                            }).bindPopup(atm.name || "Cajero automático sin nombre").addTo(atmLayer);
                        }
                    }
                    for (const atm of atmPoints) {
                        const rank = Number.isInteger(atm.rank) ? atm.rank : null;
                        const isNearest = rank === 1;
                        const isTopThree = rank !== null && rank <= 3;
                        const isSelected = selectedAtmId !== null && String(atm.id) === selectedAtmId;
                        const popup = document.createElement("div");
                        const rankLabel = document.createElement("div");
                        const title = document.createElement("strong");
                        if (isSelected || rank !== null) {
                            rankLabel.textContent = isSelected
                                ? "SELECCIONADO"
                                : isNearest ? "#1 · MÁS CERCANO" : `#${rank} · CERCANO`;
                            rankLabel.style.color = isSelected ? "#007b9c" : isNearest ? "#d9432b" : "#a96700";
                            rankLabel.style.fontSize = "11px";
                            rankLabel.style.fontWeight = "700";
                            popup.append(rankLabel);
                        }
                        title.textContent = atm.name || "Cajero automático sin nombre";
                        popup.append(title);
                        if (Number.isFinite(atm.distanceMeters)) {
                            const distance = document.createElement("div");
                            distance.textContent = `${Math.round(atm.distanceMeters)} m caminando`;
                            popup.append(distance);
                        }
                        const marker = L.circleMarker([atm.lat, atm.lon], {
                            radius: isSelected ? 15 : isNearest ? 13 : isTopThree ? 11 : 8,
                            color: isSelected ? "#ffffff" : isNearest ? "#fff7ed" : isTopThree ? "#713f12" : "#5b21b6",
                            weight: isSelected ? 5 : isNearest ? 4 : isTopThree ? 3 : 2,
                            fillColor: isSelected ? "#00c2ff" : isNearest ? "#ff6048" : isTopThree ? "#ffb547" : "#8b5cf6",
                            fillOpacity: 0.98,
                            className: isSelected ? "selected-atm" : isNearest ? "closest-atm" : ""
                        }).bindPopup(popup).addTo(atmLayer);
                        if (isSelected) {
                            marker.bindTooltip("Seleccionado", { permanent: true, direction: "top", offset: [0, -11] });
                        } else if (isNearest) {
                            marker.bindTooltip("Más cercano", { permanent: true, direction: "top", offset: [0, -9] });
                        }
                        bounds.push([atm.lat, atm.lon]);
                    }
                    if (!atmSearchMode) {
                        // The start marker is sent in the same result payload below when a search has run.
                        const origin = message.searchOrigin;
                        if (origin) {
                            L.circleMarker([origin.lat, origin.lon], {
                                radius: 8, color: "#111827", weight: 2, fillColor: "#facc15", fillOpacity: 1
                            }).bindPopup("Punto de partida").addTo(originLayer);
                            bounds.push([origin.lat, origin.lon]);
                        }
                    }

                    if (bounds.length > 0) {
                        map.fitBounds(bounds, { padding: [24, 24], maxZoom: 16 });
                    }
                    if (selectedAtm) {
                        map.setView([selectedAtm.lat, selectedAtm.lon], 17, { animate: true });
                    }
                    updateReplay(message.position, false);
                });

                postStatus("ready");
            } catch (error) {
                const message = `Map initialization failed: ${error.message}. Optimization and decision history remain available.`;
                setTileStatus(message);
                postStatus("map-error");
            }
        })();
    </script>
</body>
</html>
